<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" role="img" aria-label="Dijital Seyyah - Anadolu Seyahatnamesi">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19"/>
      <stop offset="50%" stop-color="#0f1b33"/>
      <stop offset="100%" stop-color="#071320"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="1196" height="176" rx="16" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Subtle Seljuk 8-Pointed Star Ornaments Left & Right -->
  <g transform="translate(92,90)" opacity="0.28" stroke="#f59e0b" stroke-width="1.2" fill="none">
    <rect x="-26" y="-26" width="52" height="52"/>
    <rect x="-26" y="-26" width="52" height="52" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="10" stroke="#00f2fe"/>
  </g>
  <g transform="translate(1108,90)" opacity="0.28" stroke="#f59e0b" stroke-width="1.2" fill="none">
    <rect x="-26" y="-26" width="52" height="52"/>
    <rect x="-26" y="-26" width="52" height="52" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="10" stroke="#00f2fe"/>
  </g>

  <!-- Eyebrow Tag -->
  <text x="600" y="42" text-anchor="middle" fill="#00f2fe" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="5">
    SEFER DER VATAN  •  EVLİYA ÇELEBİ &amp; İBN BATTÛTA İZİNDE
  </text>

  <!-- Main Title -->
  <text x="600" y="96" text-anchor="middle" fill="url(#titleGrad)" filter="url(#softGlow)" font-family="'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="3">
    DİJİTAL SEYYAH
  </text>

  <!-- Glowing Seljuk Divider -->
  <line x1="210" y1="116" x2="990" y2="116" stroke="url(#lineGrad)" stroke-width="2"/>
  <polygon points="600,108 608,116 600,124 592,116" fill="#f59e0b"/>

  <!-- Subtitle -->
  <text x="600" y="148" text-anchor="middle" fill="#cbd5e1" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" letter-spacing="1.5">
    Anadolu Seyahatnamesi  |  81 İl  •  7 Bölge  •  162 Görsel  •  2-Opt Rota Motoru &amp; İnteraktif Portal
  </text>
</svg>
