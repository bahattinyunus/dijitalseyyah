<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Dijital Seyyah — Anadolu Seyahatnamesi Logosu">
  <defs>
    <!-- Obsidian Midnight Base -->
    <radialGradient id="dsBg" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#13203c"/>
      <stop offset="55%" stop-color="#0a1122"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <!-- 24K Antique Seljuk Gold -->
    <linearGradient id="dsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Luminous Dervish Turquoise / Cyan -->
    <linearGradient id="dsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="45%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Emerald Horizon Accent -->
    <linearGradient id="dsEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="dsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Shield -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#dsBg)" stroke="url(#dsGold)" stroke-width="3.5"/>
  <rect x="16" y="16" width="224" height="224" rx="46" fill="none" stroke="url(#dsCyan)" stroke-width="1" stroke-opacity="0.38" stroke-dasharray="6 4"/>

  <!-- Astrolabe Degree Ring -->
  <circle cx="128" cy="128" r="98" fill="none" stroke="url(#dsGold)" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="128" cy="128" r="91" fill="none" stroke="url(#dsCyan)" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 6"/>

  <!-- Cardinal Astrolabe Notches -->
  <g stroke="url(#dsGold)" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
    <line x1="128" y1="22" x2="128" y2="32"/>
    <line x1="128" y1="224" x2="128" y2="234"/>
    <line x1="22" y1="128" x2="32" y2="128"/>
    <line x1="224" y1="128" x2="234" y2="128"/>
  </g>

  <!-- Seljuk 8-Pointed Star (Rub-el-Hizb: Two Interlocking Squares at 0° and 45°) -->
  <g filter="url(#dsGlow)">
    <!-- Square 1 (0 deg) -->
    <rect x="66" y="66" width="124" height="124" rx="8" fill="rgba(15, 23, 42, 0.55)" stroke="url(#dsGold)" stroke-width="3"/>
    <!-- Square 2 (45 deg) -->
    <rect x="66" y="66" width="124" height="124" rx="8" transform="rotate(45 128 128)" fill="rgba(10, 17, 34, 0.72)" stroke="url(#dsGold)" stroke-width="3"/>
  </g>

  <!-- Inner Turquoise Octagon Filigree -->
  <polygon points="128,54 180,76 202,128 180,180 128,202 76,180 54,128 76,76" fill="none" stroke="url(#dsCyan)" stroke-width="1.4" stroke-opacity="0.55"/>

  <!-- Graceful Crescent Moon cradling the Center -->
  <path d="M128,68 A56,56 0 1,0 184,124 A44,44 0 1,1 128,68 Z" fill="url(#dsGold)" opacity="0.22"/>

  <!-- Winding Golden Expedition Road & Open Seyahatname Book at Base -->
  <path d="M98,176 C110,164 118,158 128,144 C138,158 146,164 158,176" fill="none" stroke="url(#dsEmerald)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Open Illuminated Book Pages -->
  <path d="M88,178 Q108,170 128,179 Q148,170 168,178 L164,190 Q146,182 128,191 Q110,182 92,190 Z" fill="url(#dsGold)" opacity="0.92"/>

  <!-- 4-Point Celestial Compass Rose Needles -->
  <g filter="url(#dsGlow)">
    <!-- North Needle (Turquoise Cyan) -->
    <polygon points="128,44 139,122 128,112 117,122" fill="url(#dsCyan)"/>
    <!-- South Needle (Antique Gold) -->
    <polygon points="128,212 139,134 128,144 117,134" fill="url(#dsGold)"/>
    <!-- East Needle -->
    <polygon points="212,128 134,139 144,128 134,117" fill="url(#dsGold)" opacity="0.88"/>
    <!-- West Needle -->
    <polygon points="44,128 122,139 112,128 122,117" fill="url(#dsCyan)" opacity="0.88"/>
  </g>

  <!-- Central Jewel (Rub-el-Hizb Core) -->
  <circle cx="128" cy="128" r="14" fill="#060913" stroke="url(#dsGold)" stroke-width="3"/>
  <circle cx="128" cy="128" r="6" fill="url(#dsCyan)"/>

  <!-- 7 Regional Constellation Stars -->
  <g fill="#fff3b0">
    <circle cx="128" cy="36" r="2.3"/>
    <circle cx="193" cy="63" r="2"/>
    <circle cx="220" cy="128" r="2"/>
    <circle cx="193" cy="193" r="2"/>
    <circle cx="63" cy="193" r="2"/>
    <circle cx="36" cy="128" r="2"/>
    <circle cx="63" cy="63" r="2"/>
  </g>
</svg>
