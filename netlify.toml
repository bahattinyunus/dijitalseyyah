[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/#admin"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/#admin"
  status = 302
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/web_data.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
